[project]
name = "ctf-architect"
version = "0.1.0a14"
description = "A CTF challenge management tool"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Jus-Codin", email = "70018166+Jus-Codin@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "cyclopts>=4.3.0",
    "jinja2>=3.1.6",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "readchar>=4.2.1",
    "rich>=14.2.0",
    "ruamel-yaml>=0.18.16",
    "textual>=7.2.0",
    "tomlkit>=0.13.3",
]

[project.scripts]
ctfa = "ctfa.cli:app"
# ctf-architect = "ctf_architect.cli:main"
# ctfa = "ctf_architect.cli:main"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# module-name = "ctfa"
module-name = ["ctf_architect", "ctfa"]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.7",
]
docs = [
    "mkdocs-material>=9.7.0",
    "mkdocstrings[python]>=1.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
include = [
    "src/**/*.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
extend-select = ["RUF100", "C90", "UP", "I", "D"]
mccabe = { max-complexity = 15 }
ignore = [
    "D100", # ignore missing docstring in module
    "D101", # ignore missing docstring in class
    "D102", # ignore missing docstring in public method
    "D103", # ignore missing docstring in public function
    "D104", # ignore missing docstring in public package
    "D105", # ignore missing docstring in magic methods
    "D107", # ignore missing docstring in __init__ methods
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = [
    "-vv",
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=ctfa",
    "--cov-report=term-missing",
    "--cov-report=html",
]
